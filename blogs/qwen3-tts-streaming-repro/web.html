<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>边生成，边朗读</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f1;color:#172920;font:16px system-ui,sans-serif}main{max-width:920px;margin:64px auto;padding:0 24px}.eyebrow{font-size:12px;letter-spacing:2px;color:#607369}h1{font-size:42px;letter-spacing:-2px;margin:12px 0}p{color:#607369;line-height:1.7}.badge{display:inline-block;background:#e0ebe0;border-radius:20px;padding:7px 14px;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}.metric,.reply{background:white;border:1px solid #dfe5dd;border-radius:16px;padding:20px}.metric small{color:#607369}.metric strong{display:block;font-size:26px;margin-top:12px;font-weight:500}.reply{min-height:180px;line-height:1.9;white-space:pre-wrap}textarea{display:block;width:100%;margin:24px 0 12px;padding:18px;border:1px solid #cbd6cd;border-radius:14px;background:white;resize:vertical;font:inherit;min-height:110px}button{border:0;border-radius:30px;padding:13px 24px;font:inherit;cursor:pointer;background:#193e2b;color:white}button.secondary{background:#e3e8e0;color:#243d2d;margin-left:8px}button:disabled{opacity:.4;cursor:default}.foot{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between}#status{font-size:13px;color:#607369}#details{font-size:13px;color:#607369;margin-top:14px}@media(max-width:650px){main{margin:28px auto}h1{font-size:34px}.metrics{grid-template-columns:repeat(2,1fr)}.row{gap:12px;flex-wrap:wrap}}
</style><main><div class="eyebrow">QWEN 27B → QWEN3 TTS · 流式加速版</div><h1>边生成，边朗读。</h1><p>发送一条消息，听模型实时回答。文字和音频通过同一个 WebSocket 传回。</p><span class="badge" id="connection">正在连接</span>
<div class="metrics"><div class="metric"><small>首文字</small><strong id="textTime">—</strong></div><div class="metric"><small>首音频包</small><strong id="pcmTime">—</strong></div><div class="metric"><small>预计开始出声</small><strong id="voiceTime">—</strong></div><div class="metric"><small>生成完成</small><strong id="doneTime">—</strong></div></div>
<div class="reply" id="reply" aria-live="polite">模型的回答会显示在这里。</div><div id="details">等待发送</div><label for="speaker">朗读音色 </label><select id="speaker" style="margin-top:18px;padding:10px;border:1px solid #cbd6cd;border-radius:10px;background:white;font:inherit"><option value="vivian">Vivian（当前默认）</option><option value="serena">Serena</option><option value="uncle_fu">Uncle Fu</option><option value="ryan">Ryan</option><option value="aiden">Aiden</option><option value="ono_anna">Ono Anna</option><option value="sohee">Sohee</option><option value="eric">Eric（四川方言）</option><option value="dylan">Dylan（北京方言）</option></select><textarea id="prompt" maxlength="2000" placeholder="输入你想问的问题…">请用两句话介绍一下杭州适合散步的地方。</textarea><div class="row"><div><button id="send" disabled>发送并朗读</button><button id="stop" class="secondary" disabled>停止</button></div><span id="status">每条消息独立回答 · Ctrl / ⌘ + Enter 发送</span></div><p class="foot">计时从点击发送开始。“预计开始出声”根据非静音采样及 Web Audio 播放排程估算，不包含扬声器实测。音频收到后即排队播放；文字暂缺时分段续读，可能有停顿。</p></main>
<script>
const $=id=>document.getElementById(id);let ws,ctx,id=null,start=0,cursor=0,nodes=new Set(),meta=null,active=false,firstText=false,firstPCM=false,firstVoice=false,audioSeconds=0,gaps=0,segments=0,trimmed=0,stopping=false;
let requestSequence=0;
function requestId(){return typeof globalThis.crypto?.randomUUID==='function'?globalThis.crypto.randomUUID():`request-${Date.now().toString(36)}-${++requestSequence}`}
function stamp(name,value=performance.now()-start){$(name).textContent=Math.round(value)+' ms'}
function details(){$('details').textContent=`音频 ${audioSeconds.toFixed(2)} 秒 · 已结束分段 ${segments} · 播放断流累计 ${Math.round(gaps)} ms · 开头静音裁剪 ${Math.round(trimmed)} ms`}
function stopAudio(){for(const n of nodes){try{n.stop()}catch{}}nodes.clear();cursor=0}
function controls(){ $('speaker').disabled=active; $('send').disabled=active||!ws||ws.readyState!==1;$('stop').disabled=!active&&!nodes.size }
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/chat');ws.binaryType='arraybuffer';ws.onopen=()=>{$('connection').textContent='已连接 · 单 WebSocket';controls()};ws.onclose=()=>{active=false;id=null;stopAudio();$('connection').textContent='连接断开，正在重连';controls();setTimeout(connect,1500)};ws.onerror=()=>{$('connection').textContent='连接异常'};
ws.onmessage=e=>{if(typeof e.data==='string'){const m=JSON.parse(e.data);if(m.type==='audio_meta'){meta=m;return}if(m.id!==id)return;if(m.type==='text'){if(!firstText){firstText=true;stamp('textTime')}$('reply').textContent+=m.text}else if(m.type==='segment_done'){segments++;details()}else if(m.type==='leading_silence'){trimmed=m.trimmed_ms;details()}else if(m.type==='done'){stamp('doneTime');active=false;$('status').textContent=nodes.size?'生成完成，正在播放':'播放完成';controls()}else if(m.type==='error'||m.type==='cancelled'){active=false;stopAudio();$('status').textContent=m.message||'已停止';controls()}return}
if(!meta||meta.id!==id||stopping||!ctx)return;const rate=meta.sample_rate;meta=null;if(!firstPCM){firstPCM=true;stamp('pcmTime')}const view=new DataView(e.data),samples=view.byteLength/2,buffer=ctx.createBuffer(1,samples,rate),data=buffer.getChannelData(0);let loud=-1;for(let i=0;i<samples;i++){data[i]=view.getInt16(i*2,true)/32768;if(loud<0&&Math.abs(data[i])>.01)loud=i}const now=ctx.currentTime;if(cursor&&now>cursor)gaps+=(now-cursor)*1000;const when=Math.max(cursor,now+.012);if(!firstVoice&&loud>=0){firstVoice=true;stamp('voiceTime',performance.now()-start+(when-now+loud/rate+(ctx.outputLatency||0))*1000)}const source=ctx.createBufferSource();source.buffer=buffer;source.connect(ctx.destination);nodes.add(source);source.onended=()=>{nodes.delete(source);if(!active&&!nodes.size)$('status').textContent='播放完成';controls()};source.start(when);cursor=when+buffer.duration;audioSeconds+=buffer.duration;details();
};}
$('send').onclick=async()=>{const text=$('prompt').value.trim();if(!text||active||ws.readyState!==1)return;active=true;controls();start=performance.now();try{ctx=ctx||new AudioContext();await ctx.resume();stopAudio();id=requestId();firstText=firstPCM=firstVoice=false;audioSeconds=gaps=segments=trimmed=0;stopping=false;meta=null;for(const key of ['textTime','pcmTime','voiceTime','doneTime'])$(key).textContent='—';$('reply').textContent='';$('details').textContent='等待模型返回…';$('status').textContent='正在生成并朗读';ws.send(JSON.stringify({type:'prompt',id,text,speaker:$('speaker').value}));controls()}catch(e){active=false;$('status').textContent=e.message;controls()}};
$('stop').onclick=()=>{stopping=true;stopAudio();if(active){ws.send(JSON.stringify({type:'cancel'}));$('status').textContent='正在停止…'}else{$('status').textContent='已停止';controls()}};
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();$('send').click()}};connect();
</script></html>
